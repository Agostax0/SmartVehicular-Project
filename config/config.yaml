carla:
  host: "localhost"
  port: 2000
  timeout: 10.0
  map: "Town03"

vehicle:
  blueprint: "vehicle.tesla.model3"
  spawn_point: null  # null = random spawn

simulation:
  max_steps: 1000
  fps: 20
  sync_mode: true
  default_scenario: "non-colliding-pedestrian"

scenarios:
  non-colliding-pedestrian:
    description: "Pedestrian crosses with enough lateral offset to avoid collision."
    walker_distance_from_vehicle: 35.0
    walker_height: 1.0
    walker_horizontal_offset: 5.0
    walker_speed: 2.0
    target_speed_mps: 5.56
    prediction_future_frames: 30
  colliding-pedestrian:
    description: "Pedestrian crosses the direct path of the ego vehicle."
    walker_distance_from_vehicle: 35.0
    walker_height: 1.0
    walker_horizontal_offset: 5.0
    walker_speed: 0.6
    target_speed_mps: 5.56
    prediction_future_frames: 30

sensors:
  camera:
    enabled: true
    width: 800
    height: 600
    fov: 60
  lidar:
    enabled: false
    channels: 32
    range: 50.0
    points_per_second: 100000

output:
  directory: "data/output"
  save_images: false
