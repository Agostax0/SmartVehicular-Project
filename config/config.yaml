carla:
  host: "localhost"
  port: 2000
  timeout: 30.0
  map: "Town03"

vehicle:
  blueprint: "vehicle.tesla.model3"
  spawn_point: 45

simulation:
  max_steps: 1000
  fps: 20
  sync_mode: true
  default_scenario: "mixed-pedestrian-cyclist"

scenarios:
  non-colliding-pedestrian:
    description: "Pedestrian crosses with enough lateral offset to avoid collision."
    walker_distance_from_vehicle: 35.0
    walker_height: 1.0
    walker_horizontal_offset: 5.0
    walker_speed: 2.0
    target_speed_mps: 5.56
    prediction_future_frames: 30
  colliding-pedestrian:
    description: "Pedestrian crosses the direct path of the ego vehicle."
    walker_distance_from_vehicle: 35.0
    walker_height: 1.0
    walker_horizontal_offset: -2.5
    walker_speed: 0.4
    target_speed_mps: 5.56
    prediction_future_frames: 30
  non-colliding-cyclist:
    description: "Cyclist crosses with enough lateral offset to avoid collision."
    walker_distance_from_vehicle: 40.0
    walker_height: 1.0
    walker_horizontal_offset: 4.0
    walker_speed: 10.0
    walker_type: "cyclist"
    target_speed_mps: 5.56
    prediction_future_frames: 30
  colliding-cyclist:
    description: "Cyclist crosses the direct path of the ego vehicle."
    walker_distance_from_vehicle: 40.0
    walker_height: 1.0
    walker_horizontal_offset: 4.0
    walker_speed: 1.0
    walker_type: "cyclist"
    target_speed_mps: 5.56
    prediction_future_frames: 30
  two-pedestrians-no-collision:
    description: "Two pedestrians cross. No collision"
    target_speed_mps: 5.56
    prediction_future_frames: 30
    walkers:
      - walker_distance_from_vehicle: 30.0
        walker_height: 1.0
        walker_horizontal_offset: 4.0
        walker_speed: 2.0
      - walker_distance_from_vehicle: 45.0
        walker_height: 1.0
        walker_horizontal_offset: -4.0
        walker_speed: 2.0
  two-pedestrians-one-collision:
    description: "Two pedestrians cross, vehicle collides with 1 pedestrian."
    target_speed_mps: 5.56
    prediction_future_frames: 30
    walkers:
      - walker_distance_from_vehicle: 30.0
        walker_height: 1.0
        walker_horizontal_offset: 4.0
        walker_speed: 0.8
      - walker_distance_from_vehicle: 45.0
        walker_height: 1.0
        walker_horizontal_offset: -4.0
        walker_speed: 2.0
  two-pedestrians-both-collision:
    description: "Two pedestrians cross, vehicle collides with both pedestrians."
    target_speed_mps: 5.56
    prediction_future_frames: 30
    walkers:
      - walker_distance_from_vehicle: 30.0
        walker_height: 1.0
        walker_horizontal_offset: 4.0
        walker_speed: 0.8
      - walker_distance_from_vehicle: 45.0
        walker_height: 1.0
        walker_horizontal_offset: -4.0
        walker_speed: 0.5

  mixed-pedestrian-cyclist:
    description: "A fast cyclist crossing from the right (clears path) and a slow pedestrian crossing from the left (collision threat)."
    target_speed_mps: 5.56
    prediction_future_frames: 30
    walkers:
      - walker_distance_from_vehicle: 40.0
        walker_height: 1.0
        walker_horizontal_offset: 4.0
        walker_speed: 2.0
        walker_type: "cyclist"
      - walker_distance_from_vehicle: 30.0
        walker_height: 1.0
        walker_horizontal_offset: -4.0
        walker_speed: 0.8
        walker_type: "pedestrian"


  low-visibility:
    description: "A low visibility driving with bad weather"
    prediction_future_frames: 30
    walker_distance_from_vehicle: 35.0
    walker_height: 1.0
    walker_horizontal_offset: -2.5
    walker_speed: 0.4
    target_speed_mps: 5.56
    weather_effects:
      cloudiness: 100
      precipitation: 100
      puddles: 100
      fog_density: 100
      fog_distance: 5
      road_wetness: 100


sensors:
  camera:
    enabled: true
    width: 800
    height: 600
    fov: 60
